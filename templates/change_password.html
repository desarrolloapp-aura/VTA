<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - VTA Analytics</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hanken Grotesk', sans-serif; background-color: #0F172A; }
    </style>
</head>
<body class="flex items-center justify-center h-screen px-4">
    <div class="w-full max-w-md bg-[#1E293B] rounded-2xl p-8 border border-slate-800 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white tracking-tight mb-2">Seguridad Requerida</h1>
            <p class="text-slate-400 text-sm">Por seguridad, debes cambiar tu contraseña temporal antes de entrar al Dashboard.</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-lg text-sm mb-6 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/change-password" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Nueva Contraseña</label>
                <div class="relative">
                    <input type="password" id="new_password" name="new_password" required minlength="6" class="w-full bg-[#0F172A] border border-slate-700 rounded-lg px-4 py-3 pr-20 text-white focus:outline-none focus:border-[#2DD4BF] focus:ring-1 focus:ring-[#2DD4BF] transition-all">
                    <button type="button" onclick="togglePassword('new_password', 'eye-new')" class="absolute right-3 top-1/2 -translate-y-1/2 focus:outline-none flex items-center justify-center">
                        <span id="eye-new" class="text-xs font-bold text-[#2DD4BF] hover:text-[#57f1db] transition-colors tracking-wide uppercase">Mostrar</span>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Confirmar Contraseña</label>
                <div class="relative">
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="6" class="w-full bg-[#0F172A] border border-slate-700 rounded-lg px-4 py-3 pr-20 text-white focus:outline-none focus:border-[#2DD4BF] focus:ring-1 focus:ring-[#2DD4BF] transition-all">
                    <button type="button" onclick="togglePassword('confirm_password', 'eye-confirm')" class="absolute right-3 top-1/2 -translate-y-1/2 focus:outline-none flex items-center justify-center">
                        <span id="eye-confirm" class="text-xs font-bold text-[#2DD4BF] hover:text-[#57f1db] transition-colors tracking-wide uppercase">Mostrar</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full bg-[#2DD4BF] hover:bg-[#14b8a6] text-[#0f172a] font-bold py-3 px-4 rounded-lg transition-colors mt-4">
                Guardar y Entrar
            </button>
        </form>
    </div>

    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.textContent = "OCULTAR";
            } else {
                input.type = "password";
                icon.textContent = "MOSTRAR";
            }
        }
    </script>
</body>
</html>
