<!DOCTYPE html><html class="dark" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Iniciar Sesión - VTA Analytics</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
    body {
        background-color: #0F172A;
        color: #dde4e1;
        font-family: 'Hanken Grotesk', sans-serif;
    }
    .glass-card {
        background: #1E293B;
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .input-field {
        background-color: #0F172A;
        border: 1px solid #3c4a46;
        color: #dde4e1;
    }
    .input-field:focus {
        outline: none;
        border-color: #2DD4BF;
        box-shadow: 0 0 0 1px #2DD4BF;
    }
    .btn-primary {
        background-color: #2DD4BF;
        color: #0F172A;
    }
    .btn-primary:hover {
        background-color: #3cddc7;
    }
</style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div class="glass-card rounded-2xl w-full max-w-md p-8 relative overflow-hidden">
        <!-- Decoration -->
        <div class="absolute top-0 right-0 -mt-16 -mr-16 w-32 h-32 bg-[#2DD4BF] rounded-full opacity-10 blur-2xl"></div>
        <div class="absolute bottom-0 left-0 -mb-16 -ml-16 w-32 h-32 bg-[#ffafd3] rounded-full opacity-10 blur-2xl"></div>
        
        <div class="relative z-10 text-center mb-8">
            <span class="material-symbols-outlined text-5xl text-[#2DD4BF] mb-2">analytics</span>
            <h1 class="text-3xl font-bold text-white tracking-tight">VTA Analytics</h1>
            <p class="text-[#bacac5] mt-2">Inicia sesión para acceder al panel</p>
        </div>

        <form method="POST" action="/login" class="relative z-10 space-y-5">
            {% if error %}
            <div class="bg-red-900/30 border border-red-500/50 text-red-200 px-4 py-3 rounded-lg text-sm flex items-center gap-3">
                <span class="material-symbols-outlined text-red-400">error</span>
                {{ error }}
            </div>
            {% endif %}

            <div>
                <label class="block text-sm font-semibold text-[#bacac5] mb-1.5" for="email">Correo Electrónico</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#859490]">mail</span>
                    <input type="email" id="email" name="email" required placeholder="tu@empresa.com" 
                           class="input-field w-full rounded-lg py-2.5 pl-10 pr-4 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-[#bacac5] mb-1.5" for="password">Contraseña</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#859490]">lock</span>
                    <input type="password" id="password" name="password" required placeholder="••••••••" 
                           class="input-field w-full rounded-lg py-2.5 pl-10 pr-10 transition-all">
                    <button type="button" onclick="togglePassword('password', 'eye-icon')" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#859490] hover:text-white focus:outline-none flex items-center justify-center">
                        <span id="eye-icon" class="material-symbols-outlined text-xl">visibility</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary w-full font-bold rounded-lg py-3 mt-4 transition-all flex justify-center items-center gap-2">
                Entrar al Dashboard
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
            </button>
        </form>
    </div>

    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.textContent = "visibility_off";
            } else {
                input.type = "password";
                icon.textContent = "visibility";
            }
        }
    </script>
</body>
</html>
